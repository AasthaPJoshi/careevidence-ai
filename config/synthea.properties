# Overrides to Synthea's default synthea.properties.
# We only want the CSV exporter — FHIR/CCDA/CPCDS/bulk exports are
# unnecessary for this project and just slow generation down and
# inflate output size.
#
# Passed to Synthea via: -c config/synthea.properties

exporter.csv.export = true
exporter.fhir.export = false
exporter.fhir.bulk_data = false
exporter.ccda.export = false
exporter.cpcds.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
