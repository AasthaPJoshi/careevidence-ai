name: CI

# Starts small: lints every shell script on push and PR. Expands in
# Phase 8 to include R package checks, SQL/data contract tests,
# leakage tests, and Docker builds — see docs/architecture.md §16 SDLC.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint all shell scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck
